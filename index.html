<!DOCTYPE html>
<html>
<head>
  <title>Apply for Mod</title>
</head>
<body>
  <h1>Moderator Application</h1>
  <form action="https://formspree.io/f/xkgbdlod" method="POST">
    <label for="name">Name:</label><br>
    <input type="text" id="name" name="Name" required><br><br>

    <label for="age">Age:</label><br>
    <input type="number" id="age" name="Age" required><br><br>

    <label for="discord">What's your Discord name?</label><br>
    <input type="text" id="discord" name="Discord" required><br><br>

    <label for="experience">Do you have experience as a mod?</label><br>
    <textarea id="experience" name="Experience" required></textarea><br><br>

    <label for="reason">Why should we pick you?</label><br>
    <textarea id="reason" name="Reason" required></textarea><br><br>

    <button type="submit">Submit Application</button>
  </form>
</body>
</html>
