<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apply for Moderator</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap');

    body {
      margin: 0;
      padding: 0;
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(270deg, #ff00cc, #00ffff, #ff9900, #00ff66, #ff0000, #6600ff);
      background-size: 1200% 1200%;
      animation: rainbow 30s ease infinite;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      overflow: hidden;
    }

    @keyframes rainbow {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    .container {
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid #ffffff;
      border-radius: 15px;
      padding: 30px;
      width: 90%;
      max-width: 600px;
      box-shadow: 0 0 20px #fff, 0 0 40px #fff inset;
      position: relative;
      z-index: 1;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      color: #ffffff;
      text-shadow: 0 0 10px #fff;
    }

    label {
      display: block;
      margin-top: 15px;
      font-size: 16px;
      color: #fff;
      text-shadow: 0 0 5px #fff;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: none;
      border-radius: 8px;
      background-color: #1a1a2e;
      color: #fff;
      box-shadow: inset 0 0 10px #fff;
    }

    input:focus, textarea:focus {
      outline: none;
      box-shadow: 0 0 10px #fff, inset 0 0 10px #fff;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background-color: #ffffff;
      color: black;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 10px #fff;
    }

    button:hover {
      background-color: #dddddd;
      box-shadow: 0 0 20px #fff, 0 0 40px #fff;
    }

    /* YouTube background */
    iframe {
      position: fixed;
      top: -50px;
      left: -50px;
      width: 120%;
      height: 120%;
      pointer-events: none;
      opacity: 0.2;
      z-index: 0;
    }
  </style>
</head>
<body>

  <!-- YouTube video background -->
  <iframe
    src="https://www.youtube.com/embed/aSMsoN55y4w?autoplay=1&mute=1&loop=1&playlist=3s2J7Fod1lAcIKVI"
    frameborder="0"
    allow="autoplay"
    allowfullscreen>
  </iframe>

  <div class="container">
    <h1>Mod Application</h1>
    <form action="https://formspree.io/f/xkgbdlod" method="POST">
      <label for="name">Name:</label>
      <input type="text" id="name" name="Name" required>

      <label for="age">Age:</label>
      <input type="number" id="age" name="Age" required>

      <label for="discord">What's your Discord name?</label>
      <input type="text" id="discord" name="Discord" required>

      <label for="lua">How strong is your Lua?</label>
      <input type="text" id="lua" name="Lua Skill Level" placeholder="Beginner / Intermediate / Advanced" required>

      <label for="experience">Do you have experience as a mod?</label>
      <textarea id="experience" name="Mod Experience" rows="3" required></textarea>

      <label for="reason">Why should we pick you?</label>
      <textarea id="reason" name="Why Pick You" rows="3" required></textarea>

      <button type="submit">Submit Application</button>
    </form>
  </div>

</body>
</html>
